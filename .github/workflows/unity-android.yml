name: Build Wildhaven Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity project structure
        run: |
          if [ ! -f ProjectSettings/ProjectVersion.txt ]; then
            echo "::error::This repository currently contains Unity scripts, not a complete Unity project. Create/open the project in Unity and commit ProjectSettings/ProjectVersion.txt, Packages/, and the Assets/ folder before running this workflow."
            exit 1
          fi

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildsPath: build
          buildName: Wildhaven
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
